name: Deviatrix Genesis CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sympy

    - name: Run test suite
      run: |
        PYTHONPATH=. python -m unittest deviatrix_genesis.tests.test_deviatrix deviatrix_genesis.v3.tests.test_v3 deviatrix_genesis.v4.tests.test_memory_export deviatrix_genesis.v5.tests.test_v5 -v 2>&1 | tee unittest.log
        test "${PIPESTATUS[0]}" -eq 0

    - name: README test count matches the suite
      run: |
        ran=$(grep -oE '^Ran [0-9]+ tests' unittest.log | grep -oE '[0-9]+')
        echo "suite ran $ran tests"
        grep -q "\*\*${ran} tests\*\* across all 4 versions" README.md || { echo "README test count does not match suite ($ran)"; exit 1; }
        grep -q "^${ran} tests across all 4 versions" README.md || { echo "README Tests section count does not match suite ($ran)"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install ruff
    - run: ruff check deviatrix_genesis/ --select E,F,W --ignore E501

  benchmark:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install sympy
    - name: Run benchmark
      run: |
        PYTHONPATH=. python -m deviatrix_genesis.v5.benchmark --brief "CI benchmark" --engines v3 --seeds 2026
